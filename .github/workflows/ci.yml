name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MAINNET_FEATURES: silent-sync/mainnet,silent-sync/core-rest,silent-sync/blindbit-http,silent-sync/fixture,silent-sync/local-index,silent-sync/low-level,silent-sync/spend,silent-sync/secret-output-tweaks,silent-sync-sqlite/mainnet,silent-wallet/mainnet,silent-wallet/client,wallet-cli/mainnet

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The toolchain version and components come from rust-toolchain.toml.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The library must build cleanly on its own with every feature set an
      # embedder can choose (the workspace build above enables them all).
      - name: Clippy (library alone, each feature set)
        run: |
          for features in "" core-rest blindbit-http fixture local-index low-level secret-output-tweaks spend mainnet "mainnet,core-rest,spend"; do
            echo "::group::features: ${features:-none}"
            cargo clippy -p silent-sync --lib --locked --features "$features" -- -D warnings
            echo "::endgroup::"
          done
          cargo clippy -p silent-sync --lib --locked --all-features -- -D warnings
      # Everything above and below builds the library with all features. This
      # step uses it as an embedder gets it (see scripts/check_embedder_view.sh).
      - name: Embedder's view (default features, docs, CLI built alone)
        run: scripts/check_embedder_view.sh
      # Fast unit + integration tests only. Tests that need Bitcoin Core are
      # `#[ignore]`d here and run in the regtest-e2e job below.
      - name: Test
        run: cargo test --workspace --locked
      # Mainnet is off by default. First with every `mainnet` feature on; then
      # with only the SDK's on, as when another crate in a build asks for it:
      # the wallet and the lab CLI must still refuse mainnet on their own.
      - name: Test (mainnet features)
        run: |
          cargo test -p silent-sync -p silent-sync-sqlite -p silent-wallet -p wallet-cli --locked \
            --features "$MAINNET_FEATURES" -- --skip k_max
          cargo test -p silent-wallet -p wallet-cli -p lab-cli --locked \
            --features silent-sync/mainnet -- --skip k_max

  # End-to-end tests against a real Bitcoin Core regtest node. They are
  # `#[ignore]`d in the normal suite because they need the binary.
  regtest-e2e:
    name: regtest end-to-end (Bitcoin Core, BlindBit Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Fetch and verify Bitcoin Core
        run: |
          exe="$(VERIFY_SIGNATURES=1 scripts/fetch_bitcoind.sh "$RUNNER_TEMP/bitcoind")"
          echo "BITCOIND_EXE=$exe" >> "$GITHUB_ENV"
      - name: Build BlindBit Oracle v2 (pinned commit)
        run: |
          exe="$(scripts/build_blindbit_oracle.sh "$RUNNER_TEMP/oracle")"
          echo "BLINDBIT_ORACLE_EXE=$exe" >> "$GITHUB_ENV"
      - name: End-to-end tests
        run: cargo test --workspace --locked -- --ignored
      # A node with mainnet parameters and no network access (genesis only):
      # refused by a default build above, a source like any other here.
      - name: End-to-end tests (mainnet features, offline mainnet-parameter node)
        run: |
          cargo test -p silent-sync -p silent-wallet -p wallet-cli --locked \
            --features "$MAINNET_FEATURES" -- --ignored mainnet a_transaction_is_never
