name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The toolchain version and components come from rust-toolchain.toml.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Fast unit + integration tests only. Tests that need Bitcoin Core will
      # live in a separate job once Phase 2 exists.
      - name: Test
        run: cargo test --workspace --locked
