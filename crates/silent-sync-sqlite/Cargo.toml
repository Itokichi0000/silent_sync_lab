[package]
name = "silent-sync-sqlite"
description = "SQLite implementation of silent-sync's SyncStore. Holds detected outputs and checkpoints; never key material."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets a store be bound to mainnet (see the feature of the same name in
# `silent-sync`). Receive side only.
mainnet = ["silent-sync/mainnet"]

[dependencies]
silent-sync = { path = "../silent-sync" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { workspace = true }

[dev-dependencies]
# For the example that syncs from a node.
silent-sync = { path = "../silent-sync", features = ["core-rest"] }
lab-testkit = { path = "../lab-testkit" }

[lints]
workspace = true
