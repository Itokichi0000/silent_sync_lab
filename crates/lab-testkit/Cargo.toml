[package]
name = "lab-testkit"
description = "TEST-ONLY helpers for Silent Sync Lab: fixture generation, regtest node control, test transaction building. Never a dependency of sync-core or lab-cli proper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sync-core = { path = "../sync-core", features = [
    "core-rest",
    "blindbit-http",
    "fixture",
    "local-index",
    "low-level",
    "secret-output-tweaks",
] }
bdk_sp = { workspace = true }
serde_json = { workspace = true }

# No workspace lints: test helpers panic on purpose (unwrap/expect).
[lints.rust]
unsafe_code = "forbid"
