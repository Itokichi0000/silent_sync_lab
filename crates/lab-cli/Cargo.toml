[package]
name = "lab-cli"
description = "Thin experimental CLI over silent-sync. NOT FOR MAINNET OR REAL FUNDS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silent-sync"
path = "src/main.rs"
# The library crate has the same name; only one of them can own the docs.
doc = false

[dependencies]
silent-sync = { path = "../silent-sync", features = ["core-rest", "blindbit-http", "fixture", "local-index"] }
silent-sync-sqlite = { path = "../silent-sync-sqlite" }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lab-testkit = { path = "../lab-testkit" }

[lints]
workspace = true
