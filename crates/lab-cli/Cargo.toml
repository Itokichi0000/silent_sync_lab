[package]
name = "lab-cli"
description = "Thin experimental CLI over sync-core. NOT FOR MAINNET OR REAL FUNDS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "silent-sync"
path = "src/main.rs"

[dependencies]
sync-core = { path = "../sync-core", features = ["core-rest"] }
lab-storage = { path = "../lab-storage" }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lab-testkit = { path = "../lab-testkit" }

[lints]
workspace = true
