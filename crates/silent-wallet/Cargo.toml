[package]
name = "silent-wallet"
description = "EXPERIMENTAL, unaudited silent payments wallet logic on top of silent-sync: unspent outputs, building and signing transactions. Mainnet only with the `mainnet` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets a wallet be made for mainnet: it then signs transactions that spend
# real funds. Unaudited code; off by default. Without it `Wallet::new`
# refuses mainnet even if `silent-sync` was built with its own `mainnet`
# feature by another crate.
mainnet = ["silent-sync/mainnet"]
# The one-stop interface (`client`): seed phrases (BIP39), a store on disk,
# your own Bitcoin Core node as the data source, receive / sync / send behind
# a handful of calls. Pulls in SQLite, a small HTTP client, the BIP39 word
# list and the operating system's random number source.
client = [
    "dep:silent-sync-sqlite",
    "dep:bip39",
    "silent-sync/core-rest",
]

[dependencies]
# `spend`: the tweak needed to spend an output, derived again from a full
# block. `low-level`: the wallet scans the transaction it built with its own
# scanner, to see its change before anything is sent.
silent-sync = { path = "../silent-sync", features = ["spend", "low-level"] }
# The upstream sender: which output keys pay a silent payment address.
bdk_sp = { workspace = true }
silent-sync-sqlite = { path = "../silent-sync-sqlite", optional = true }
# BIP39: phrase <-> entropy <-> seed. English word list only, no `rand`.
bip39 = { version = "=2.2.2", optional = true, default-features = false, features = ["std"] }
# Random numbers from the operating system: the order of inputs and outputs
# and the lock time of a transaction, and (feature `client`) the entropy of a
# new phrase.
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lab-testkit = { path = "../lab-testkit" }

[lints]
workspace = true
